# Wanderline travel API + Postgres on Render
databases:
  - name: wanderline-db
    plan: free
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: wanderline-api
    runtime: node
    plan: free
    region: oregon
    rootDir: Server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "4000"
      - key: STORAGE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: wanderline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_SERVICE_URL
        value: ""
      - key: AI_SERVICE_KEY
        sync: false