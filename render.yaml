# Wanderline travel API with Postgres bundled inside the Docker web service.
# Free tier: no managed DB, no persistent disk — catalog reseeds on every cold start.
services:
  - type: web
    name: wanderline-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: Server
    dockerfilePath: ./Server/Dockerfile.render
    dockerContext: ./Server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "4000"
      - key: STORAGE_MODE
        value: postgres
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgres
      - key: POSTGRES_DB
        value: wanderline
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@127.0.0.1:5432/wanderline
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_SERVICE_URL
        value: ""
      - key: AI_SERVICE_KEY
        sync: false
